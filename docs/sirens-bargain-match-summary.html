<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siren's Bargain — Match Summary</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap');
  :root{--navy:#0B1D33;--navy-deep:#06111F;--gold:#C9A227;--gold-lt:#E4C25A;--gold-d:#A5811C;
    --pearl:#EDE6D4;--haze:#9DB6C4;--mist:#C4D6E2;--up:#9AD16C;--down:#E08585;--panel:rgba(11,29,51,.72);}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(120% 80% at 50% 8%,#1c4576 0%,#0B1D33 46%,#06111F 100%);color:var(--pearl);min-height:100%;overflow-x:hidden;}
  .bubbles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .bubble{position:absolute;bottom:-40px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(251,247,236,.85), rgba(237,230,212,.12) 60%, rgba(237,230,212,0) 70%);animation:rise linear infinite;}
  @keyframes rise{0%{transform:translateY(0);opacity:0;}12%{opacity:.7;}90%{opacity:.4;}100%{transform:translateY(-108vh);opacity:0;}}

  .wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:34px 20px 40px;}
  .victory{text-align:center;margin-bottom:22px;}
  .emblem{width:78px;height:78px;filter:drop-shadow(0 0 26px rgba(201,162,39,.6));}
  .vlabel{font-family:'Cinzel',Georgia,serif;font-size:13px;font-weight:600;letter-spacing:.36em;text-transform:uppercase;color:var(--gold-lt);margin-top:8px;}
  .vwinner{font-family:'Cinzel',Georgia,serif;font-size:clamp(30px,7.5vw,42px);font-weight:700;color:var(--pearl);margin-top:4px;text-shadow:0 2px 20px rgba(0,0,0,.5);}
  .vmeta{font-size:13px;color:var(--haze);margin-top:8px;letter-spacing:.02em;}

  .pcard{background:var(--panel);border:1px solid rgba(201,162,39,.2);border-radius:16px;padding:15px;margin-top:14px;backdrop-filter:blur(6px);}
  .pcard.win{border-color:rgba(201,162,39,.6);box-shadow:0 0 0 1px rgba(201,162,39,.25),0 8px 26px rgba(0,0,0,.35);}
  .phead{display:flex;align-items:center;gap:11px;}
  .av{width:36px;height:36px;flex:0 0 36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#0B1D33;}
  .pname{font-size:16px;font-weight:600;color:var(--pearl);}
  .ptag{font-size:10px;font-weight:600;letter-spacing:.06em;color:#2A1F07;background:linear-gradient(90deg,var(--gold-d),var(--gold-lt));border-radius:6px;padding:2px 7px;margin-left:7px;}
  .rating{margin-left:auto;text-align:right;}
  .rating .line{font-size:12px;color:var(--haze);} .rating .line b{color:var(--pearl);font-weight:600;}
  .delta{font-size:16px;font-weight:700;font-family:'Cinzel',Georgia,serif;}
  .delta.up{color:var(--up);} .delta.down{color:var(--down);}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;}
  .stat{background:rgba(255,255,255,.04);border-radius:10px;padding:9px 4px;text-align:center;}
  .stat .v{font-size:18px;font-weight:700;color:var(--pearl);font-family:'Cinzel',Georgia,serif;}
  .stat .l{font-size:10px;letter-spacing:.04em;color:var(--haze);margin-top:3px;}

  .btns{margin-top:22px;display:flex;flex-direction:column;gap:11px;}
  .btn{font:inherit;font-size:16px;font-weight:600;border-radius:12px;cursor:pointer;padding:14px;border:1px solid transparent;width:100%;transition:.15s;}
  .btn.prim{color:#2A1F07;background:linear-gradient(90deg,var(--gold-d),var(--gold-lt),var(--gold-d));background-size:200% 100%;box-shadow:0 6px 22px rgba(201,162,39,.35);}
  .btn.prim:hover{background-position:100% 0;}
  .row2{display:flex;gap:11px;} .row2 .btn{flex:1;}
  .btn.ghost{background:rgba(255,255,255,.04);border-color:rgba(201,162,39,.32);color:var(--mist);}
  .btn.ghost:hover{background:rgba(201,162,39,.1);}
  .saved{text-align:center;font-size:12px;color:var(--haze);margin-top:16px;display:flex;align-items:center;justify-content:center;gap:7px;}
  .saved .dot{width:7px;height:7px;border-radius:50%;background:var(--up);}
</style>
</head>
<body>
  <div class="bubbles" id="bubbles"></div>
  <div class="wrap">

    <div class="victory">
      <svg class="emblem" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4C25A"/><stop offset="1" stop-color="#A5811C"/></linearGradient>
        <radialGradient id="pl" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#FBF7EC"/><stop offset="1" stop-color="#CFC6AE"/></radialGradient></defs>
        <path d="M32 50 L13 27 A24 24 0 0 1 51 27 Z" fill="url(#sh)" stroke="#A5811C" stroke-width="1"/>
        <g stroke="#0B1D33" stroke-width="1.6" stroke-linecap="round"><line x1="32" y1="50" x2="13" y2="27"/><line x1="32" y1="50" x2="20" y2="19.5"/><line x1="32" y1="50" x2="26" y2="16"/><line x1="32" y1="50" x2="32" y2="15"/><line x1="32" y1="50" x2="38" y2="16"/><line x1="32" y1="50" x2="44" y2="19.5"/><line x1="32" y1="50" x2="51" y2="27"/></g>
        <path d="M13 27 Q17 31 21 27 Q25 31 29 27 Q32 30.5 35 27 Q39 31 43 27 Q47 31 51 27" fill="none" stroke="#A5811C" stroke-width="1.2"/>
        <circle cx="32" cy="50" r="6.2" fill="url(#pl)" stroke="#A5811C" stroke-width="0.8"/><circle cx="29.6" cy="47.8" r="1.7" fill="#FBF7EC"/>
      </svg>
      <div class="vlabel">Victory</div>
      <div class="vwinner" id="winnerName">Mia wins!</div>
      <div class="vmeta" id="meta">Completed 3 realms &middot; 24 turns &middot; 8:32</div>
    </div>

    <div id="cards"></div>

    <div class="btns">
      <button class="btn prim" onclick="console.log('rematch')">Rematch</button>
      <div class="row2">
        <button class="btn ghost" onclick="console.log('leaderboard')">Leaderboard</button>
        <button class="btn ghost" onclick="console.log('menu')">Main menu</button>
      </div>
    </div>

    <div class="saved"><span class="dot"></span>Stats saved to leaderboard</div>
  </div>

<script>
  const bc=document.getElementById('bubbles');
  for(let i=0;i<16;i++){const b=document.createElement('div');b.className='bubble';const s=4+Math.random()*11;
    b.style.width=b.style.height=s+'px';b.style.left=(Math.random()*100)+'%';
    b.style.animationDuration=(7+Math.random()*7)+'s';b.style.animationDelay=(-Math.random()*10)+'s';bc.appendChild(b);}

  const PLAYERS=[
    {name:'Mia',av:'#6E5AA8',win:true,rb:1741,ra:1755,realms:3,pearls:14,steals:2,tributes:5},
    {name:'Finn',av:'#7FA8E8',win:false,rb:2015,ra:2001,realms:1,pearls:9,steals:1,tributes:3},
  ];
  const cards=document.getElementById('cards');
  PLAYERS.forEach(p=>{const d=p.ra-p.rb;const up=d>=0;
    const el=document.createElement('div');el.className='pcard'+(p.win?' win':'');
    el.innerHTML=`<div class="phead">
        <div class="av" style="background:${p.av}">${p.name[0]}</div>
        <div class="pname">${p.name}${p.win?'<span class="ptag">WINNER</span>':''}</div>
        <div class="rating"><div class="line"><b>${p.rb}</b> &rarr; <b>${p.ra}</b></div>
          <div class="delta ${up?'up':'down'}">${up?'+':''}${d}</div></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="v">${p.realms}</div><div class="l">REALMS</div></div>
        <div class="stat"><div class="v">${p.pearls}</div><div class="l">PEARLS</div></div>
        <div class="stat"><div class="v">${p.steals}</div><div class="l">STEALS</div></div>
        <div class="stat"><div class="v">${p.tributes}</div><div class="l">TRIBUTES</div></div>
      </div>`;
    cards.appendChild(el);});
</script>
</body>
</html>
