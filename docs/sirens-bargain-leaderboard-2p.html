<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siren's Bargain — Head to Head</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap');
  :root{--navy:#0B1D33;--navy-deep:#06111F;--gold:#C9A227;--gold-lt:#E4C25A;--gold-d:#A5811C;
    --pearl:#EDE6D4;--haze:#9DB6C4;--mist:#C4D6E2;--panel:rgba(11,29,51,.72);}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(120% 90% at 50% -10%,#17395F 0%,#0B1D33 45%,#06111F 100%);color:var(--pearl);min-height:100%;overflow-x:hidden;}
  .rays{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .ray{position:absolute;top:-20%;width:34%;height:150%;background:linear-gradient(180deg,rgba(201,162,39,.07),transparent);filter:blur(7px);mix-blend-mode:screen;}
  .ray.r1{left:6%;transform:rotate(9deg);}.ray.r3{left:72%;transform:rotate(12deg);width:24%;}

  .topbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:16px 18px;background:linear-gradient(180deg,rgba(6,17,31,.9),rgba(6,17,31,0));}
  .back{width:40px;height:40px;border-radius:10px;border:1px solid rgba(201,162,39,.35);background:rgba(255,255,255,.04);color:var(--pearl);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .topbar h1{font-family:'Cinzel',Georgia,serif;font-size:20px;font-weight:600;letter-spacing:.03em;}

  .wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:6px 18px 40px;}

  /* versus header */
  .versus{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:20px 10px 8px;}
  .vp{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;}
  .vp .av{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;color:#0B1D33;}
  .vp.lead .av{box-shadow:0 0 0 3px var(--gold-lt),0 6px 18px rgba(201,162,39,.4);}
  .vp .nm{font-size:15px;font-weight:600;color:var(--pearl);}
  .vp .crown{font-size:13px;color:var(--gold-lt);height:16px;}
  .score{text-align:center;flex:0 0 auto;padding:0 4px;}
  .score .s{font-family:'Cinzel',Georgia,serif;font-size:40px;font-weight:700;color:var(--pearl);line-height:1;}
  .score .s .dash{color:var(--haze);margin:0 4px;}
  .score .lead{font-size:12px;color:var(--gold-lt);margin-top:6px;letter-spacing:.04em;}

  .panel{background:var(--panel);border:1px solid rgba(201,162,39,.2);border-radius:16px;overflow:hidden;backdrop-filter:blur(6px);margin-top:18px;}
  .cmp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 16px;gap:8px;}
  .cmp+.cmp{border-top:1px solid rgba(255,255,255,.06);}
  .cmp .l{text-align:right;font-family:'Cinzel',Georgia,serif;font-size:18px;font-weight:600;color:var(--haze);}
  .cmp .r{text-align:left;font-family:'Cinzel',Georgia,serif;font-size:18px;font-weight:600;color:var(--haze);}
  .cmp .l.win,.cmp .r.win{color:var(--gold-lt);}
  .cmp .lab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--haze);text-align:center;min-width:78px;}

  .seclbl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--haze);margin:24px 4px 8px;}
  .match{display:flex;align-items:center;gap:12px;padding:12px 16px;}
  .match+.match{border-top:1px solid rgba(255,255,255,.06);}
  .match .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;}
  .match .w{font-size:14px;color:var(--pearl);flex:1;}
  .match .w b{font-weight:600;}
  .match .meta{font-size:12px;color:var(--haze);}
  .foot{text-align:center;font-size:11px;color:rgba(157,182,196,.6);margin-top:18px;}
</style>
</head>
<body>
  <div class="rays"><div class="ray r1"></div><div class="ray r3"></div></div>
  <div class="topbar">
    <button class="back" onclick="history.back()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1>Head to Head</h1>
  </div>
  <div class="wrap" id="root"></div>

<script>
  // ---- config: your two players + their avatar colours ----
  const PLAYERS={ Mia:{color:'#6E5AA8'}, Finn:{color:'#7FA8E8'} };
  const ALLOW=Object.keys(PLAYERS);

  // ---- drop your API's match list here (POST payloads) ----
  const MATCHES=[
   {endedAt:'2026-08-06T20:00:00Z',turns:24,winner:'Mia', players:[{name:'Mia',realms:3,steals:2,tributes:5},{name:'Finn',realms:1,steals:1,tributes:3}]},
   {endedAt:'2026-08-05T21:00:00Z',turns:31,winner:'Finn',players:[{name:'Mia',realms:2,steals:1,tributes:2},{name:'Finn',realms:3,steals:2,tributes:4}]},
   {endedAt:'2026-08-05T18:00:00Z',turns:19,winner:'Mia', players:[{name:'Mia',realms:3,steals:3,tributes:3},{name:'Finn',realms:1,steals:0,tributes:2}]},
   {endedAt:'2026-08-03T20:00:00Z',turns:22,winner:'Mia', players:[{name:'Mia',realms:3,steals:1,tributes:4},{name:'Finn',realms:2,steals:2,tributes:3}]},
   {endedAt:'2026-08-02T19:00:00Z',turns:28,winner:'Finn',players:[{name:'Mia',realms:1,steals:1,tributes:3},{name:'Finn',realms:3,steals:1,tributes:5}]},
   {endedAt:'2026-08-01T20:00:00Z',turns:20,winner:'Mia', players:[{name:'Mia',realms:3,steals:2,tributes:2},{name:'Finn',realms:0,steals:1,tributes:2}]},
   {endedAt:'2026-07-30T21:00:00Z',turns:26,winner:'Mia', players:[{name:'Mia',realms:3,steals:2,tributes:4},{name:'Finn',realms:2,steals:2,tributes:3}]},
   {endedAt:'2026-07-28T18:00:00Z',turns:18,winner:'Mia', players:[{name:'Mia',realms:3,steals:1,tributes:3},{name:'Finn',realms:1,steals:1,tributes:2}]},
   {endedAt:'2026-07-27T20:00:00Z',turns:30,winner:'Finn',players:[{name:'Mia',realms:1,steals:0,tributes:2},{name:'Finn',realms:3,steals:2,tributes:4}]},
   {endedAt:'2026-07-25T19:00:00Z',turns:23,winner:'Mia', players:[{name:'Mia',realms:3,steals:1,tributes:3},{name:'Finn',realms:2,steals:0,tributes:2}]},
  ];

  function compute(matches){
    const valid=matches.filter(m=>m.players.every(p=>ALLOW.includes(p.name)) && ALLOW.includes(m.winner));
    const t={}; ALLOW.forEach(n=>t[n]={wins:0,realms:0,steals:0,tributes:0});
    valid.forEach(m=>{t[m.winner].wins++; m.players.forEach(p=>{t[p.name].realms+=p.realms;t[p.name].steals+=p.steals;t[p.name].tributes+=p.tributes;});});
    const games=valid.length;
    ALLOW.forEach(n=>t[n].winRate=games?Math.round(t[n].wins/games*100):0);
    const asc=[...valid].sort((a,b)=>new Date(a.endedAt)-new Date(b.endedAt));
    ALLOW.forEach(n=>{let best=0,c=0;asc.forEach(m=>{if(m.winner===n){c++;best=Math.max(best,c);}else c=0;});t[n].bestStreak=best;});
    const recent=[...valid].sort((a,b)=>new Date(b.endedAt)-new Date(a.endedAt)).slice(0,4);
    return {games,t,recent};
  }

  const [A,B]=ALLOW, {games,t,recent}=compute(MATCHES);
  const leader = t[A].wins>=t[B].wins ? A : B;
  const rows=[['WINS','wins'],['WIN RATE','winRate','%'],['REALMS','realms'],['STEALS','steals'],['TRIBUTES','tributes'],['BEST STREAK','bestStreak']];
  const fmtDate=iso=>new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'});

  document.getElementById('root').innerHTML=`
    <div class="versus">
      <div class="vp ${leader===A?'lead':''}"><div class="crown">${leader===A?'\u265B leading':''}</div><div class="av" style="background:${PLAYERS[A].color}">${A[0]}</div><div class="nm">${A}</div></div>
      <div class="score"><div class="s">${t[A].wins}<span class="dash">\u2013</span>${t[B].wins}</div><div class="lead">${games} games played</div></div>
      <div class="vp ${leader===B?'lead':''}"><div class="crown">${leader===B?'\u265B leading':''}</div><div class="av" style="background:${PLAYERS[B].color}">${B[0]}</div><div class="nm">${B}</div></div>
    </div>

    <div class="panel">
      ${rows.map(([lab,key,suf])=>{const a=t[A][key],b=t[B][key];const sfx=suf||'';
        return `<div class="cmp"><div class="l ${a>=b?'win':''}">${a}${sfx}</div><div class="lab">${lab}</div><div class="r ${b>=a?'win':''}">${b}${sfx}</div></div>`;}).join('')}
    </div>

    <div class="seclbl">Recent matches</div>
    <div class="panel">
      ${recent.map(m=>`<div class="match"><span class="dot" style="background:${PLAYERS[m.winner].color}"></span>
        <span class="w"><b>${m.winner}</b> won</span>
        <span class="meta">${m.turns} turns &middot; ${fmtDate(m.endedAt)}</span></div>`).join('')}
    </div>
    <div class="foot">Tallied live from ${games} stored matches</div>`;
</script>
</body>
</html>
